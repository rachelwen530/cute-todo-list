<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>小猫待办</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="card" aria-labelledby="title">
        <div class="title-row">
          <div>
            <p class="eyebrow">TODAY'S LITTLE PLAN</p>
            <h1 id="title">小猫待办 <span aria-hidden="true">🐾</span></h1>
          </div>
          <div class="cat" aria-label="一只开心的小猫">=^･ω･^=</div>
        </div>

        <form id="task-form" class="new-task">
          <label class="sr-only" for="task-input">添加一件小事</label>
          <input id="task-input" type="text" maxlength="120" placeholder="添加一件小事…" autocomplete="off" required />
          <button type="submit">添加</button>
        </form>

        <div class="progress" aria-live="polite">
          <div class="progress-copy"><span id="progress-text">今天从一件小事开始</span><strong id="progress-number">0 / 0</strong></div>
          <div class="track"><div id="bar" class="bar"></div></div>
        </div>

        <ul id="task-list" class="task-list" aria-label="待办事项"></ul>

        <div class="footer">
          <button id="clear-done" class="text-button" type="button">清除已完成</button>
          <span>所有内容都会保存在这台电脑里 ✦</span>
        </div>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
